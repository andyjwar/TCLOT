# Deploys the web-push Cloudflare Worker (web/workers/push-api/).
#
# The site and this Worker ship separately: Pages/Vercel rebuild the front end
# on every push, but tclot-push-api only changed when someone ran
# `wrangler deploy` by hand. That is why GW deadline reminders can still
# show copy that already landed on main (e.g. the old "Submit your waiver
# claims in Moves…" body after the muppet copy merged).
#
# One-time setup — Repo → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN    token with "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard → Workers & Pages → Account ID
name: Deploy push-api Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'web/workers/push-api/**'
      - '.github/workflows/deploy-push-api-worker.yml'
  workflow_dispatch:

concurrency:
  group: push-api-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/workers/push-api/package-lock.json

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Install dependencies
        working-directory: web/workers/push-api
        run: npm ci

      - name: Test
        working-directory: web/workers/push-api
        run: npm test

      - name: Deploy Worker
        working-directory: web/workers/push-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Health check
        run: |
          code=""
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/push-health.json -w '%{http_code}' --max-time 20 \
              https://tclot-push-api.tclot.workers.dev/health) || code=""
            echo "attempt $i: GET /health → HTTP ${code:-none}"
            [ "${code:-}" = "200" ] && break
            sleep 5
          done
          if [ "${code:-}" != "200" ]; then
            echo "::warning::Worker did not answer with 200 — deploy succeeded but check wrangler tail."
            exit 0
          fi
          cat /tmp/push-health.json
          echo
