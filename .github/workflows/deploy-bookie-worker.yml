# Deploys the bookie Cloudflare Worker (web/workers/bookie/).
#
# The site and the Worker ship separately: Pages/Vercel rebuild the front end on
# every push, but the Worker only changed when someone ran `wrangler deploy` by
# hand. That drift is why Titan / Minnow / last place were live in the bundle
# while the Worker still served the champion-only market sheet. This job keeps
# them in step.
#
# One-time setup — Repo → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN    token with "Edit Cloudflare Workers" + D1 edit
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare dashboard → Workers & Pages → Account ID
#   BOOKIE_D1_DATABASE_ID   `wrangler d1 list` → id of the tclot-bookie database
#
# The D1 id is injected here rather than committed so wrangler.toml stays a
# template anyone can fork.
name: Deploy bookie Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'web/workers/bookie/**'
      - '.github/workflows/deploy-bookie-worker.yml'
  workflow_dispatch:

# A half-finished Worker deploy is worse than a queued one.
concurrency:
  group: bookie-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/workers/bookie/package-lock.json

      # Fail loudly with instructions rather than letting wrangler emit a
      # cryptic auth error.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BOOKIE_D1_DATABASE_ID: ${{ secrets.BOOKIE_D1_DATABASE_ID || vars.BOOKIE_D1_DATABASE_ID }}
        run: |
          missing=""
          [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${BOOKIE_D1_DATABASE_ID:-}" ] && missing="$missing BOOKIE_D1_DATABASE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing — add them under Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          echo "Cloudflare credentials present."

      # wrangler.toml ships a placeholder id so the repo stays forkable.
      - name: Point wrangler at the live D1 database
        env:
          BOOKIE_D1_DATABASE_ID: ${{ secrets.BOOKIE_D1_DATABASE_ID || vars.BOOKIE_D1_DATABASE_ID }}
        working-directory: web/workers/bookie
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const id = process.env.BOOKIE_D1_DATABASE_ID.trim();
            const f = 'wrangler.toml';
            const before = fs.readFileSync(f, 'utf8');
            const after = before.replace(/^database_id = .*\$/m, 'database_id = \"' + id + '\"');
            if (after === before) {
              console.error('database_id line not found in wrangler.toml');
              process.exit(1);
            }
            fs.writeFileSync(f, after);
          "
          grep -c '^database_id = ' wrangler.toml

      - name: Install wrangler
        working-directory: web/workers/bookie
        run: npm ci

      # Schema is additive and every statement is IF NOT EXISTS, so replaying it
      # is safe and picks up columns added since the last deploy.
      - name: Apply D1 schema
        working-directory: web/workers/bookie
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute tclot-bookie --remote --file=schema.sql --yes

      - name: Deploy Worker
        working-directory: web/workers/bookie
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # The Worker opens markets lazily on traffic; this first request makes the
      # new season boards appear without waiting for the half-hourly cron.
      - name: Warm the Worker so new markets open
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/state.json -w '%{http_code}' --max-time 30 \
              https://tclot-bookie.tclot.workers.dev/api/state) && break || sleep 5
          done
          echo "GET /api/state → HTTP ${code:-none}"
          if [ "${code:-}" = "200" ]; then
            node -e "
              const s = require('/tmp/state.json');
              const kinds = (s.markets || []).map((m) => m.kind);
              console.log('markets open:', kinds.join(', ') || '(none)');
              for (const k of ['outright', 'titan', 'minnow', 'last']) {
                if (!kinds.includes(k)) console.log('::warning::no ' + k + ' market yet — the next sync should open it');
              }
            "
          else
            echo "::warning::Worker did not answer with 200 — deploy succeeded but check the logs with 'wrangler tail'."
          fi
